<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>גופנים</title>
<style>
@font-face{font-family:notoserif;src:url(f/notoserif.woff2)}
@font-face{font-family:notoserif;src:url(f/notoserif-b.woff2);font-weight:700}
@font-face{font-family:notosans;src:url(f/notosans.woff2)}
@font-face{font-family:notosans;src:url(f/notosans-b.woff2);font-weight:700}
@font-face{font-family:frl;src:url(f/frl.woff2)}
@font-face{font-family:frl;src:url(f/frl-b.woff2);font-weight:700}
@font-face{font-family:arimo;src:url(f/arimo.woff2)}
@font-face{font-family:arimo;src:url(f/arimo-b.woff2);font-weight:700}
@font-face{font-family:tinos;src:url(f/tinos.woff2)}
@font-face{font-family:tinos;src:url(f/tinos-b.woff2);font-weight:700}
@font-face{font-family:shofar;src:url(f/shofar.woff2)}
@font-face{font-family:shofar;src:url(f/shofar-b.woff2);font-weight:700}
@font-face{font-family:stam;src:url(../fonts/stam.woff2)}
:root{--bg:#f7f3ea;--ink:#1b1714;--line:#d8cdb8;--soft:#9b9186;--gold:#8a6a1f}
@media(prefers-color-scheme:dark){:root{--bg:#15130f;--ink:#eee7db;--line:#332e25;--soft:#7d7466;--gold:#d6b158}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;padding:.9rem;font-family:system-ui}
.bar{position:sticky;top:0;background:var(--bg);padding:.5rem 0 .7rem;z-index:5;
 border-bottom:1px solid var(--line);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar label{font-size:.78rem;color:var(--soft)}
input[type=range]{flex:1;min-width:120px}
.card{border-bottom:1px solid var(--line);padding:1rem 0 1.3rem}
h2{font:600 .74rem/1 system-ui;letter-spacing:.09em;text-transform:uppercase;
 color:var(--gold);margin:0 0 .15rem}
.note{font:400 .7rem/1.4 system-ui;color:var(--soft);margin:0 0 .75rem}
.p{font-size:var(--s,21px);line-height:1.95;margin:0}
.ns{font-family:notoserif}.na{font-family:notosans}.fr{font-family:frl}
.ar{font-family:arimo}.ti{font-family:tinos}.sh{font-family:shofar}
.leyn{margin-top:2.5rem;border-top:2px solid var(--gold);padding-top:1rem}
.tm{font-family:stam;font-size:calc(var(--s,21px) * .95);line-height:2.4;margin:.5rem 0 0}
.tmn{font-family:notoserif;font-size:calc(var(--s,21px) * .95);line-height:2.3;margin:.5rem 0 0}
</style></head><body>
<div class="bar"><label>גודל</label><input type="range" id="sz" min="16" max="30" value="21">
<span id="szv" style="font-size:.8rem;color:var(--soft)">21px</span></div>
<div id="out"></div>
<script>
const T='<b>בָּרֵךְ</b> עָלֵֽינוּ יְהֹוָה אֱלֹהֵֽינוּ אֶת־הַשָּׁנָה הַזֹּאת וְאֶת־כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה, וְתֵן טַל וּמָטָר לִבְרָכָה עַל פְּנֵי הָאֲדָמָה וְשַׂבְּ֒עֵֽנוּ מִטּוּבֶֽךָ: בָּרוּךְ אַתָּה יְהֹוָה מְבָרֵךְ הַשָּׁנִים:';
const TAAM='וַיְדַבֵּ֥ר יְהוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃ צַ֚ו אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם אֶת־קָרְבָּנִ֨י לַחְמִ֜י';
const F=[['ns','Noto Serif Hebrew','נוכחי'],['na','Noto Sans Hebrew','סן־סריף'],
 ['fr','Frank Ruhl Libre','הקלאסי — אפשרי עכשיו, כי הטעמים עוברים לאשורית'],
 ['ar','Arimo','סן־סריף, תואם Arial'],['ti','Tinos','סריף, תואם Times'],
 ['sh','Shofar','קולמוס']];
out.innerHTML=F.map(([c,n,s])=>
 `<div class="card"><h2>${n}</h2><p class="note">${s}</p><div class="p ${c}">${T}</div></div>`).join('')
 +`<div class="leyn"><h2>קריאת התורה — אשורית (סת״ם)</h2>
   <p class="note">עם טעמי המקרא</p><div class="tm">${TAAM}</div>
   <h2 style="margin-top:1.4rem">להשוואה — Noto Serif</h2><div class="tmn">${TAAM}</div></div>`;
sz.oninput=e=>{document.documentElement.style.setProperty('--s',e.target.value+'px');
 szv.textContent=e.target.value+'px'};
</script></body></html>
