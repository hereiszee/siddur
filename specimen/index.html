<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>גופנים</title>
<style>
@font-face{font-family:keter;src:url(f/keter.woff2)}
@font-face{font-family:keter;src:url(f/keter-b.woff2);font-weight:700}
@font-face{font-family:notoserif;src:url(f/notoserif.woff2)}
@font-face{font-family:notoserif;src:url(f/notoserif-b.woff2);font-weight:700}
@font-face{font-family:notosans;src:url(f/notosans.woff2)}
@font-face{font-family:notosans;src:url(f/notosans-b.woff2);font-weight:700}
@font-face{font-family:shofar;src:url(f/shofar.woff2)}
@font-face{font-family:shofar;src:url(f/shofar-b.woff2);font-weight:700}
@font-face{font-family:frank;src:url(f/frank.woff2)}
@font-face{font-family:frank;src:url(f/frank-b.woff2);font-weight:700}
@font-face{font-family:hadasim;src:url(f/hadasim.woff2)}
@font-face{font-family:hadasim;src:url(f/hadasim-b.woff2);font-weight:700}
body{background:#f7f3ea;color:#1b1714;margin:0;padding:1rem;
 font-family:system-ui}
@media(prefers-color-scheme:dark){body{background:#15130f;color:#eee7db}}
.card{border-top:1px solid #d8cdb8;padding:1rem 0 1.4rem}
h2{font:600 .78rem/1 system-ui; letter-spacing:.08em; text-transform:uppercase;
 color:#8a6a1f; margin:0 0 .1rem}
.note{font:400 .72rem/1.4 system-ui; color:#9b9186; margin:0 0 .7rem}
.p{font-size:20px; line-height:1.95; margin:0 0 .5rem}
.tm{font-size:19px; line-height:2.2; margin:.4rem 0 0; opacity:.92}
.k{font-family:keter}.ns{font-family:notoserif}.na{font-family:notosans}
.sh{font-family:shofar}.fr{font-family:frank}.hd{font-family:hadasim}
</style></head><body>
<div id="out"></div>
<script>
const AMIDA='<b>בָּרֵךְ</b> עָלֵֽינוּ יְהֹוָה אֱלֹהֵֽינוּ אֶת־הַשָּׁנָה הַזֹּאת וְאֶת־כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה, וְתֵן טַל וּמָטָר לִבְרָכָה עַל פְּנֵי הָאֲדָמָה:';
const TAAM='וַיְדַבֵּ֥ר יְהוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃ צַ֚ו אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם';
const F=[['k','Keter YG','נוכחי — קולמוס'],['ns','Noto Serif Hebrew','גוגל / SIL OFL'],
 ['na','Noto Sans Hebrew','גוגל / SIL OFL'],['sh','Shofar','קולמוס'],
 ['fr','Frank Ruehl CLM','קולמוס — הקלאסי'],['hd','Hadasim CLM','קולמוס']];
document.getElementById('out').innerHTML=F.map(([c,n,s])=>
 `<div class="card"><h2>${n}</h2><p class="note">${s}</p>
  <div class="p ${c}">${AMIDA}</div><div class="tm ${c}">${TAAM}</div></div>`).join('');
</script></body></html>
