<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>גופנים — סריף</title>
<style>
@font-face{font-family:ezra;src:url(f/ezra.woff2)}
@font-face{font-family:ezrasr;src:url(f/ezrasr.woff2)}
@font-face{font-family:cardo;src:url(f/cardo.woff2)}
@font-face{font-family:cardo;src:url(f/cardo-b.woff2);font-weight:700}
@font-face{font-family:nachlieli;src:url(f/nachlieli.woff2)}
@font-face{font-family:nachlieli;src:url(f/nachlieli-b.woff2);font-weight:700}
@font-face{font-family:notoserif;src:url(f/notoserif.woff2)}
@font-face{font-family:notoserif;src:url(f/notoserif-b.woff2);font-weight:700}
@font-face{font-family:frank;src:url(f/frank.woff2)}
@font-face{font-family:frank;src:url(f/frank-b.woff2);font-weight:700}
@font-face{font-family:tinos;src:url(f/tinos.woff2)}
@font-face{font-family:tinos;src:url(f/tinos-b.woff2);font-weight:700}
@font-face{font-family:shofar;src:url(f/shofar.woff2)}
@font-face{font-family:shofar;src:url(f/shofar-b.woff2);font-weight:700}
:root{--bg:#f7f3ea;--ink:#1b1714;--line:#d8cdb8;--soft:#9b9186;--gold:#8a6a1f;
 --card:#fffdf7;--s:21px;--lh:1.95}
@media(prefers-color-scheme:dark){:root{--bg:#15130f;--ink:#eee7db;--line:#332e25;
 --soft:#7d7466;--gold:#d6b158;--card:#1d1a15}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;padding:.8rem;font-family:system-ui}
.bar{position:sticky;top:0;background:var(--bg);padding:.5rem 0 .6rem;z-index:5;
 border-bottom:1px solid var(--line)}
.ctl{display:flex;gap:.5rem;align-items:center;font-size:.75rem;color:var(--soft);
 margin-bottom:.3rem}
input[type=range]{flex:1;min-width:100px}
.card{border-bottom:1px solid var(--line);padding:.9rem 0 1.2rem}
h2{font:600 .74rem/1 system-ui;letter-spacing:.09em;text-transform:uppercase;
 color:var(--gold);margin:0 0 .12rem}
.note{font:400 .7rem/1.4 system-ui;color:var(--soft);margin:0 0 .7rem}
.p{font-size:var(--s);line-height:var(--lh);margin:0;text-align:start}
.ez{font-family:ezra}.ezs{font-family:ezrasr}.ca{font-family:cardo}
.na{font-family:nachlieli}.ns{font-family:notoserif}.fr{font-family:frank}
.ti{font-family:tinos}.sh{font-family:shofar}
</style></head><body>
<div class="bar">
 <div class="ctl"><span>גודל</span><input type="range" id="sz" min="16" max="30" value="21"><b id="szv">21</b></div>
 <div class="ctl"><span>רווח שורה</span><input type="range" id="lh" min="150" max="250" value="195"><b id="lhv">1.95</b></div>
</div>
<div id="out"></div>
<script>
const T='<b>בָּרֵךְ</b> עָלֵֽינוּ יְהֹוָה אֱלֹהֵֽינוּ אֶת־הַשָּׁנָה הַזֹּאת וְאֶת־כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה, וְתֵן טַל וּמָטָר לִבְרָכָה עַל פְּנֵי הָאֲדָמָה וְשַׂבְּ֒עֵֽנוּ מִטּוּבֶֽךָ: בָּרוּךְ אַתָּה יְהֹוָה מְבָרֵךְ הַשָּׁנִים: שְׁמַע יִשְׂרָאֵל יְהֹוָה אֱלֹהֵֽינוּ יְהֹוָה אֶחָֽד:';
const F=[
 ['ez','Ezra SIL','נבנה לעברית מנוקדת — על פי כתר לנינגרד'],
 ['ezs','Ezra SIL SR','אותו גופן, משיכות דקות יותר'],
 ['ca','Cardo','סריף רנסנסי'],
 ['na','Nachlieli CLM','קולמוס'],
 ['ns','Noto Serif Hebrew','הקודם'],
 ['fr','Frank Ruehl CLM','קולמוס — הקלאסי של ספרי הקודש'],
 ['ti','Tinos','תואם Times'],
 ['sh','Shofar','קולמוס']];
out.innerHTML=F.map(([c,n,s])=>
 `<div class="card"><h2>${n}</h2><p class="note">${s}</p><div class="p ${c}">${T}</div></div>`).join('');
const R=document.documentElement;
sz.oninput=e=>{R.style.setProperty('--s',e.target.value+'px');szv.textContent=e.target.value};
lh.oninput=e=>{R.style.setProperty('--lh',e.target.value/100);lhv.textContent=(e.target.value/100).toFixed(2)};
</script></body></html>
